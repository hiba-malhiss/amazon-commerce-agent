services:
  postgres:
    image: postgres:17
    container_name: amazon-commerce-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent_dev_password
      POSTGRES_DB: amazon_commerce_agent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d amazon_commerce_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
